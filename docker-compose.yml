version: '3.8'

services:
  # AI Microservice (FastAPI + NLP Engine)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: clauseguard-ai-engine
    ports:
      - "8000:8000"
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_db
    volumes:
      - ./uploads:/app/uploads
      - chroma_data:/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend API Gateway (Node.js / Express)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: clauseguard-server-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://127.0.0.1:27017/clauseguard_ai}
      - JWT_SECRET=${JWT_SECRET:-clauseguard_super_secure_jwt_secret_token_2026}
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
    volumes:
      - ./uploads:/app/uploads
      - server_data:/app/data
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  # Frontend Web App (Vite React + Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clauseguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  chroma_data:
  server_data:
